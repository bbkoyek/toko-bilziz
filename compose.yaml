services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: toko-bilziz-backend
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: *****
      DB_PASSWORD: ****
      DB_NAME: web_bilziz

    ports:
      - "2000:2000"

    depends_on:
      - mysql

    networks:
      - toko-network

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile

    container_name: toko-bilziz-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - toko-network

    volumes:
      - mysql_data

    networks:
      - toko-network

  networks:
  toko-network:
    external: true