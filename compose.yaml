services:

  mysql:
    image: mysql:8.0
    container_name: toko-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ****
      MYSQL_DATABASE: toko_bilziz
      MYSQL_USER: ******
      MYSQL_PASSWORD: *****

    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - toko-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: toko-bilziz-backend
    restart: unless-stopped

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: *****
      DB_PASSWORD: ****
      DB_NAME: toko-bilziz

    ports:
      - "2000:2000"

    depends_on:
      - mysql

    networks:
      - toko-network


  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile

    container_name: toko-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

    networks:
      - toko-network


volumes:
  mysql_data:


networks:
  toko-network:
