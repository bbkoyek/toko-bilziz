<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — Bilziz Sport</title>
<link rel="stylesheet" href="../css/reset.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/navbar.css">
<link rel="stylesheet" href="../css/button.css">
<link rel="stylesheet" href="../css/form.css">
<link rel="stylesheet" href="../css/modal.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div id="navbar"></div>

<section class="login-page">
  <div class="login-box">
    <div class="section-label">Area Admin</div>
    <div class="section-title">LOGIN</div>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="login-username" name="username" placeholder="Username admin" autocomplete="username">
        <div class="field-error"></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-password" name="password" placeholder="Password" autocomplete="current-password">
        <div class="field-error"></div>
      </div>
      <button type="submit" class="form-submit" id="login-submit">Masuk</button>
    </form>
  </div>
</section>

<div id="footer"></div>
<div id="wa-float"></div>

<script src="../js/helper.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/notification.js"></script>
<script src="../js/loading.js"></script>

<script src="../component/navbar.js"></script>
<script src="../component/footer.js"></script>

<script src="../js/pages/login.js"></script>
</body>
</html>
